services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tutorlink_test}
      POSTGRES_USER: ${DB_USER:-tutorlink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el archivo .env local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env.docker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tutorlink_test}
      DB_USER: ${DB_USER:-tutorlink_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el archivo .env local}
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ""
      VITE_RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
    ports:
      - "5173:5173"

volumes:
  postgres_data:
