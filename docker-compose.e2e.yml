name: tutorlink-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorlink_e2e
      POSTGRES_USER: tutorlink_e2e
      POSTGRES_PASSWORD: tutorlink_e2e_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorlink_e2e -d tutorlink_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
